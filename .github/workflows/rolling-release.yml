name: rolling release

# Every push to main rebuilds the Windows and Linux binaries and replaces the
# single "rolling" release, which is marked Latest. Pushing a tag v1.2.3 builds
# the same binaries and publishes them as release v1.2.3 (Latest until the
# next push to main), with the notes in release/NOTES-1.2.3.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
          # The oldest supported Ubuntu runner: the binary needs a glibc at
          # least this old on the user's machine.
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'rolling' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy Pillow pycryptodome soundfile pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Stamp build info
        shell: bash
        run: |
          printf 'VERSION = "%s"\nCOMMIT = "%s"\nDATE = "%s"\n' \
            "$LABEL" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)" > taiko2x6/_build_info.py

      - name: Build
        run: pyinstaller --noconfirm --clean Taiko2x6Wizard.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "Taiko2x6Wizard-$env:LABEL-${{ matrix.platform }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item dist/Taiko2x6Wizard.exe, release/README_FIRST.txt, config.ini.example $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          if ($env:LABEL -ne 'rolling') { Copy-Item dist/Taiko2x6Wizard.exe . }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          d="Taiko2x6Wizard-$LABEL-${{ matrix.platform }}"
          mkdir "$d"
          cp dist/Taiko2x6Wizard release/README_FIRST-linux.txt config.ini.example "$d"
          chmod +x "$d/Taiko2x6Wizard"
          tar -czf "$d.tar.gz" "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            Taiko2x6Wizard-*.zip
            Taiko2x6Wizard-*.tar.gz
            Taiko2x6Wizard.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="release/NOTES-${TAG#v}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" dist/* --verify-tag --latest \
            --title "Taiko2x6Wizard $TAG" --notes-file "$notes"

      - name: Replace the rolling release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          {
            echo "Automatic build of \`main\` at ${short} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "Rebuilt on every push, so it may be less tested than the numbered releases."
            echo
            echo "| File | Platform |"
            echo "|------|----------|"
            echo "| \`Taiko2x6Wizard-rolling-win64.zip\` | 64-bit Windows: unzip and run \`Taiko2x6Wizard.exe\` |"
            echo "| \`Taiko2x6Wizard-rolling-linux-x86_64.tar.gz\` | 64-bit Linux (glibc 2.35+): extract and run \`./Taiko2x6Wizard\` |"
            echo
            echo "See README_FIRST in the archive for the files you add yourself (Font.ttf, T14LOAD.bin, …)."
            echo
            echo "### Recent commits"
            git log -15 --pretty='- %s (%h)'
          } > notes.md
          gh release delete rolling --cleanup-tag --yes || true
          gh release create rolling dist/* \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Rolling build (${short})" \
            --notes-file notes.md
